trigger:
  branches:
    include:
      - staging

pool:
  vmImage: ubuntu-latest

variables:
  - group: landing-jokerlabs

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: Use Node 22
    inputs:
      versionSpec: '22.x'

  - script: npm install -g pnpm
    displayName: Install pnpm

  - script: pnpm install --frozen-lockfile
    displayName: Install dependencies

  - script: npm install -g vercel
    displayName: Install Vercel CLI

  - script: vercel pull --yes --environment=production --token=$(PAT-vercel)
    displayName: Pull Vercel project settings
    env:
      VERCEL_ORG_ID: $(VERCEL_ORG_ID)
      VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

  - script: vercel build --prod --token=$(PAT-vercel)
    displayName: Build
    env:
      VERCEL_ORG_ID: $(VERCEL_ORG_ID)
      VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

  - script: vercel deploy --prebuilt --prod --token=$(PAT-vercel)
    displayName: Deploy to production
    env:
      VERCEL_ORG_ID: $(VERCEL_ORG_ID)
      VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
